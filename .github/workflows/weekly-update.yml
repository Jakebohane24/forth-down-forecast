name: Automated forecast update

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. The first schedule is midnight Pacific standard
    # time each day. The second is 8:00 AM Pacific standard time on Sundays.
    - cron: "0 8 * * *"
    - cron: "0 16 * * 0"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEPLOY_DATABASE_URL: ${{ secrets.DEPLOY_DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      MODEL_ARTIFACT_URL: ${{ secrets.MODEL_ARTIFACT_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          grep -v '^nfl-data-py' requirements.txt > /tmp/requirements-github.txt
          pip install -r /tmp/requirements-github.txt
          pip install --no-deps nfl-data-py==0.3.3

      - name: Download production model
        run: |
          test -n "$MODEL_ARTIFACT_URL" || { echo "MODEL_ARTIFACT_URL is not configured"; exit 1; }
          mkdir -p artifacts/models
          curl --fail --location --retry 3 "$MODEL_ARTIFACT_URL" -o /tmp/production-model.tar.gz
          tar -xzf /tmp/production-model.tar.gz -C artifacts/models
          test -f artifacts/models/production/models.joblib
          test -f artifacts/models/production/metadata.json

      - name: Generate and publish weekly predictions
        run: >-
          python scripts/weekly_local_update.py
          --skip-weather
          --database-url "$DEPLOY_DATABASE_URL"
          --odds-api-key "$ODDS_API_KEY"
